services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api.local
    ports:
      - "8000:8000"
    # Secrets and config are read from a local, git-ignored .env file.
    # Copy .env.example to .env and fill in real values. Never inline keys here.
    env_file:
      - .env
    environment:
      - PORT=8000
    restart: always

  frontend:
    image: node:20-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    restart: always
