name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Prove the pinned set green on every interpreter actually used:
        # CI baseline (3.11) and the dev/review interpreter (3.13) — ITM-016.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          # Deterministic, non-production key so crypto/profile tests can run.
          APP_SECRET_KEY: ci-test-secret-key
          PYTHONPATH: .
        run: pytest -q
