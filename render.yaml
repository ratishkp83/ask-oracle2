# Render Blueprint — ONE native-Python Web Service that serves the FastAPI API
# (under /v1) AND the built React executive SPA (at root). No Docker.
#
# Build: install Python deps, then build the SPA (vite -> <repo>/dist).
# Run:   uvicorn; SERVE_SPA=1 makes FastAPI serve dist at root, API at /v1 only.
# See docs/DEPLOY-render.md for the full checklist + security notes.
#
# Preconditions (ADR-009, docs/07-deployment-plan.md): connect each client DB with
# a least-privilege READ-ONLY account; set APP_SECRET_KEY (encrypts saved profile
# passwords); for a public URL, set APP_API_KEY (gates the /v1 API).
#
# The legacy two-service layout (API + Streamlit admin) is in git history; the
# React surface (Phase 9+) is now the primary UI. Streamlit can be added back as a
# second service if you want the admin tool — see DEPLOY-render.md.
services:
  - type: web
    name: ask-oracle-reports
    env: python
    region: singapore            # match your users / Supabase region (oregon|ohio|frankfurt|singapore)
    plan: free                   # demo: free instance, no card needed (sleeps after ~15m idle)
    autoDeploy: false            # deploy manually (respects the no-CI push posture)
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && npm ci && npm run build
    startCommand: python -m uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/health
    # For persistence across restarts/redeploys, switch plan -> starter and
    # uncomment this disk + set STORAGE_DIR to /var/data (a paid plan; ~$7/mo + disk):
    # disk:
    #   name: aor-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: SERVE_SPA
        value: "1"
      - key: STORAGE_DIR         # ephemeral on free (lost on restart); use /var/data with the disk above
        value: /opt/render/project/src/storage
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      # ── Required secret ──────────────────────────────────────────────────────
      # Derives the Fernet key that encrypts saved profile passwords. Generate once:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      # WARNING: changing it invalidates all saved connections (re-add required).
      - key: APP_SECRET_KEY
        sync: false
      # ── LLM (NL→SQL) ─────────────────────────────────────────────────────────
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      # ── Optional ─────────────────────────────────────────────────────────────
      # Gate the /v1 API behind X-API-Key. The SPA shell/assets stay public; the
      # bundle must be built with VITE_AOR_API_KEY=<same value> to call the API.
      # (The key ends up in the public bundle — for real privacy front the service
      # with Cloudflare Access / an IP allow-list instead. See DEPLOY-render.md.)
      - key: APP_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS       # only if the API is called cross-origin (same-origin SPA needs none)
        sync: false
      # ── Email-a-report (optional; OFF until SMTP_USER + SMTP_PASSWORD set) ────
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD         # Gmail App Password
        sync: false
      - key: EMAIL_FROM
        sync: false
