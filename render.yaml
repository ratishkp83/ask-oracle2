services:
  - type: web
    name: ask-oracle-reports-api
    env: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama3-70b-8192
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PYTHONPATH
        value: /opt/render/project/src

  - type: web
    name: ask-oracle-reports-ui
    env: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: streamlit run src/app.py --server.address=0.0.0.0 --server.port=$PORT --server.headless=true --server.enableCORS=false --server.enableXsrfProtection=false
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama3-70b-8192
      - key: STORAGE_DIR
        value: /opt/render/project/src/storage
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PYTHONPATH
        value: /opt/render/project/src
